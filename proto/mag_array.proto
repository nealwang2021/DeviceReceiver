syntax = "proto3";

option csharp_namespace = "MagArrayGrpc";

package magarray;

import "google/protobuf/empty.proto";

service MagArrayLeakageDetection {
  rpc ListSerialPorts(google.protobuf.Empty) returns (ListSerialPortsResponse);

  rpc StartDetection(StartDetectionRequest) returns (OperationReply);

  rpc StopDetection(google.protobuf.Empty) returns (OperationReply);

  rpc GetStatus(google.protobuf.Empty) returns (RuntimeStatus);

  rpc ResetBaseline(google.protobuf.Empty) returns (OperationReply);

  rpc GetLatestFrame(GetLatestFrameRequest) returns (MagArrayFrame);

  rpc StreamFrames(StreamFramesRequest) returns (stream MagArrayFrame);
}

enum PreprocessMode {
  PREPROCESS_MODE_UNSPECIFIED = 0;
  PREPROCESS_MODE_NONE = 1;
  PREPROCESS_MODE_FIXED_MIDPOINT = 2;
  PREPROCESS_MODE_AUTO_BASELINE = 3;
  PREPROCESS_MODE_SLOW_TRACKING_BASELINE = 4;
}

message ListSerialPortsResponse {
  repeated SerialPortInfo ports = 1;
}

message SerialPortInfo {
  string name = 1;
}

message MagPreprocessConfig {
  PreprocessMode mode = 1;

  // AutoBaseline模式下，用前多少帧估计每个通道baseline。
  int32 baseline_frames = 2;

  // FixedMidpoint模式下使用。16位无符号数据常用32768。
  double fixed_midpoint = 3;

  // SlowTrackingBaseline模式下使用。
  double tracking_factor = 4;
}

message StartDetectionRequest {
  string port_name = 1;

  // 0表示使用默认1000000。
  int32 baudrate = 2;

  MagPreprocessConfig preprocess = 3;
}

message OperationReply {
  bool ok = 1;
  string message = 2;
}

message RuntimeStatus {
  bool running = 1;

  string port_name = 2;
  int32 baudrate = 3;

  string last_error = 4;

  int32 sensor_count = 5;
  int32 axis_count = 6;
  int32 channel_count = 7;
  int32 samples_per_channel = 8;
  int32 data_group = 9;

  int32 queue_capacity = 10;
  int32 max_queue_len = 11;
  int32 overrun_count = 12;

  int64 frame_index = 13;

  bool baseline_ready = 14;
  int32 baseline_frame_count = 15;
  int32 baseline_frames = 16;
  PreprocessMode preprocess_mode = 17;
}

message GetLatestFrameRequest {
  bool include_raw_values = 1;
  bool include_processed_values = 2;
  bool include_channel_values = 3;
  bool include_sensor_values = 4;
}

message StreamFramesRequest {
  bool include_raw_values = 1;
  bool include_processed_values = 2;
  bool include_channel_values = 3;
  bool include_sensor_values = 4;

  // 0表示不限制推流帧率。
  int32 max_frames_per_second = 5;
}

message MagArrayFrame {
  int64 timestamp_unix_ms = 1;
  int64 frame_index = 2;

  int32 sensor_count = 3;
  int32 axis_count = 4;
  int32 channel_count = 5;
  int32 samples_per_channel = 6;

  // 60个通道：channel = sensor_index * 3 + axis_index
  repeated MagChannelData channels = 7;

  // 20个传感器的XYZ概要数据，便于画热力图、时序图、C扫图特征值。
  repeated MagSensorResult sensor_results = 8;

  RuntimeStatus status = 9;
}

message MagChannelData {
  int32 channel_index = 1;
  int32 sensor_index = 2;
  int32 axis_index = 3;
  string axis_name = 4;

  double baseline = 5;

  // 原始数据，一般在30000多附近。
  repeated double raw_values = 6;

  // 扣除baseline后的正负变化量。
  repeated double processed_values = 7;

  double raw_mean = 8;
  double processed_mean = 9;
}

message MagSensorResult {
  int32 sensor_index = 1;

  double x_mean = 2;
  double y_mean = 3;
  double z_mean = 4;

  double x_latest = 5;
  double y_latest = 6;
  double z_latest = 7;

  double magnitude_mean = 8;
  double magnitude_latest = 9;
}